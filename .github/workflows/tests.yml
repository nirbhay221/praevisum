name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The suite runs with no credentials on purpose. It builds a real SQLite
      # database from the real schema files in a temp directory, so a column
      # added in one schema file and forgotten in another fails here rather
      # than on the phone line.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests -q
